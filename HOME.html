<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAN — Space Settlement</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Aptos","Segoe UI Variable Text","Segoe UI","Helvetica Neue",Arial,sans-serif;background:#f6e8d5;color:#473a32}
body{overflow-x:hidden}
.topbar{
 position:fixed;z-index:20;top:0;left:0;right:0;height:72px;
 display:flex;align-items:center;justify-content:center;
 background:rgba(255,247,235,.88);backdrop-filter:blur(14px);
 border-bottom:1px solid rgba(105,76,58,.14)
}
.brand{position:absolute;left:30px;font-weight:750;letter-spacing:.12em;font-size:15px;color:#4b3b32}
.missions{display:flex;align-items:center;gap:25px}
.mission{display:flex;align-items:center;gap:7px;color:#77675d;text-decoration:none;font-size:11px;font-weight:650;letter-spacing:.055em;white-space:nowrap}
.mission b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid rgba(117,82,61,.28);font-size:9px;color:#b96e48}
.mission:first-child{color:#a75e3d}
.hero{
 min-height:100vh;padding:104px 6vw 185px;
 position:relative;display:flex;align-items:flex-start;
 background:#f3dfc5 url("./origin-starcraft-warm.jpg") center/contain no-repeat;
}
.hero::after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,rgba(255,244,225,.12),rgba(255,239,215,.02) 58%,rgba(255,240,219,.08));
 pointer-events:none
}
.hero-copy{position:relative;z-index:2;max-width:510px;margin-top:3vh}
.kicker{font-size:12px;font-weight:700;letter-spacing:.16em;color:#9e6547;margin:0 0 14px}
h1{font-family:"Aptos Display","Segoe UI Variable Display","Helvetica Neue",Arial,sans-serif;font-size:clamp(36px,4.2vw,62px);line-height:1.02;letter-spacing:-.035em;margin:0;color:#45372f;font-weight:620}
.subtitle{font-size:17px;line-height:1.6;color:#67564c;max-width:430px;margin:18px 0 0}
.bottom{
 position:absolute;z-index:5;left:4vw;right:4vw;bottom:24px;
 display:grid;grid-template-columns:repeat(8,1fr);gap:9px
}
.tile{
 min-width:0;text-decoration:none;color:#4c3e35;background:rgba(255,248,237,.87);
 border:1px solid rgba(105,76,58,.16);border-radius:12px;overflow:hidden;
 box-shadow:0 10px 30px rgba(94,58,35,.09);backdrop-filter:blur(9px)
}
.tile img{display:block;width:100%;height:67px;object-fit:cover}
.tile div{padding:8px 9px 9px}
.tile small{display:block;font-size:9px;letter-spacing:.08em;color:#b06c49;margin-bottom:3px}
.tile span{font-size:10px;font-weight:700;letter-spacing:.035em}
@media(max-width:1050px){.missions{gap:10px}.mission span{display:none}.bottom{grid-template-columns:repeat(4,1fr)}.hero{padding-bottom:300px}}
@media(max-width:650px){.topbar{height:62px}.brand{left:16px}.missions{margin-left:70px;gap:6px}.hero{padding:88px 20px 390px;background-position:62% center}.hero-copy{margin-top:0;max-width:330px}.subtitle{font-size:15px}.bottom{grid-template-columns:repeat(2,1fr);left:14px;right:14px}.tile img{height:48px}}
</style>

<style>
.site-title{
  margin:0 0 15px;
  color:#9e6547;
  font-family:"Aptos","Segoe UI Variable Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  line-height:1.2;
  font-weight:750;
  letter-spacing:.14em;
}
</style>


<style>
/* HOME V4 */
.hero-copy .site-title,
.hero-copy h1,
.hero-copy .subtitle{
  font-size:21px !important;
}
.hero-copy h1{
  line-height:1.28 !important;
  letter-spacing:.01em !important;
  font-weight:700 !important;
}
.hero-copy .site-title{
  line-height:1.3 !important;
}
.hero-copy .subtitle{
  line-height:1.55 !important;
  max-width:500px !important;
}
@media(max-width:650px){
  .hero-copy .site-title,
  .hero-copy h1,
  .hero-copy .subtitle{font-size:19px !important;}
}
</style>


<style>
/* HOME V6 — move title farther left and enlarge */
.hero{
  padding-left:2.2vw !important;
}
.hero-copy{
  margin-left:0 !important;
  max-width:440px !important;
}
.hero-copy .site-title,
.hero-copy h1{
  font-size:27px !important;
}
.hero-copy h1{
  line-height:1.22 !important;
  letter-spacing:.005em !important;
}
@media(max-width:650px){
  .hero{padding-left:14px !important;}
  .hero-copy .site-title,
  .hero-copy h1{font-size:23px !important;}
}
</style>


<style>
/* HOME V7 — stronger title contrast */
.hero-copy .site-title{
  color:#9b3f24 !important;
  font-weight:800 !important;
  text-shadow:0 1px 0 rgba(255,248,235,.65), 0 2px 8px rgba(91,45,27,.12);
}
</style>


<style>
/* HOME V8 — refined tagline composition */
.hero-copy h1{
  max-width:430px !important;
  font-size:29px !important;
  line-height:1.18 !important;
  letter-spacing:.015em !important;
  font-weight:680 !important;
}
.hero-copy h1 span{
  display:block;
  white-space:nowrap;
}
.hero-copy h1 span + span{
  margin-top:4px;
}
@media(max-width:650px){
  .hero-copy h1{
    font-size:23px !important;
    max-width:330px !important;
  }
}
</style>


<style>
/* HOME V9 — mission card number + title on one line */
.tile div{
  display:flex !important;
  align-items:center !important;
  gap:7px !important;
  padding:9px 9px 10px !important;
  white-space:nowrap !important;
}
.tile small{
  display:inline !important;
  margin:0 !important;
  flex:0 0 auto !important;
}
.tile span{
  display:inline !important;
  min-width:0 !important;
}
</style>


<style>
/* HOME V10 — show each mission thumbnail in full */
.tile img{
  width:100% !important;
  height:82px !important;
  object-fit:contain !important;
  object-position:center center !important;
  background:#f3e3cf !important;
}
@media(max-width:650px){
  .tile img{height:68px !important;}
}
</style>


<style>
/* HOME V11 — balanced mission-thumbnail crop */
.tile img{
  width:100% !important;
  height:118px !important;
  object-fit:cover !important;
  object-position:center 43% !important;
  background:transparent !important;
}
.tile{
  border-radius:12px !important;
}
@media(max-width:1050px){
  .tile img{height:125px !important;}
}
@media(max-width:650px){
  .tile img{height:112px !important;}
}
</style>

<style>
html{scroll-behavior:auto!important}
header.topbar,header.top-nav,.topbar,.top-nav{display:none!important}
</style>
<style id="v22-home-responsive">
/* Desktop HOME is untouched. These rules apply only on narrower screens. */
@media(max-width:900px){
  html,body{min-width:0!important;overflow-x:hidden!important}
  .hero{
    min-height:100dvh!important;
    height:auto!important;
    padding-left:clamp(16px,4vw,34px)!important;
    padding-right:clamp(16px,4vw,34px)!important;
    background-size:cover!important;
    background-position:center center!important;
  }
  .hero-copy{max-width:min(460px,72vw)!important;width:auto!important}
  .bottom{
    left:16px!important;right:16px!important;
    grid-template-columns:repeat(4,minmax(0,1fr))!important;
    gap:8px!important;
  }
  .tile{min-width:0!important}
  .tile img{width:100%!important;object-fit:cover!important}
}
@media(max-width:620px){
  .hero{
    padding-top:24px!important;
    padding-bottom:420px!important;
    background-position:60% center!important;
  }
  .hero-copy{max-width:88vw!important}
  .bottom{
    left:10px!important;right:10px!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:7px!important;
  }
  .tile img{height:72px!important}
}
</style>

<style id="v23-home-top-spacing">
/* V23: shorten only the opening gap; preserve the approved HOME composition. */
.hero{
  padding-top:clamp(18px,2.1vh,28px)!important;
}
.hero-copy{
  margin-top:0!important;
}
@media(max-width:900px){
  .hero{padding-top:18px!important}
}
</style>

<style id="v40-home-mission-tiles-lower">
/* Preserve the approved original hero image; separate the eight mission tiles from it. */
.mission-strip,.mission-grid,.missions,.mission-cards,.mission-row{
  position:relative!important;
  z-index:3!important;
  margin-top:clamp(34px,5vh,64px)!important;
  transform:none!important;
}
@media(max-width:900px){
  .mission-strip,.mission-grid,.missions,.mission-cards,.mission-row{
    margin-top:30px!important;
  }
}
</style>


<style id="v41-home-bottom-actual-fix">
/* ACTUAL eight-card container: place it below the hero image rather than on top of it. */
.hero{
  margin-bottom:175px!important;
  overflow:visible!important;
}
.bottom{
  bottom:-155px!important;
  left:4vw!important;
  right:4vw!important;
  z-index:6!important;
}

/* Give the cards a clean background once they sit below the main image. */
.bottom::before{
  content:"";
  position:absolute;
  z-index:-1;
  left:-4vw;
  right:-4vw;
  top:-22px;
  bottom:-22px;
  background:#f6e8d5;
  border-top:1px solid rgba(105,76,58,.10);
}

@media(max-width:900px){
  .hero{margin-bottom:315px!important}
  .bottom{
    bottom:-295px!important;
    left:16px!important;
    right:16px!important;
  }
  .bottom::before{
    left:-16px;
    right:-16px;
  }
}

@media(max-width:620px){
  .hero{margin-bottom:500px!important}
  .bottom{
    bottom:-480px!important;
    left:10px!important;
    right:10px!important;
  }
  .bottom::before{
    left:-10px;
    right:-10px;
  }
}
</style>


<style id="home-v13-content-fit">
@media(min-width:901px){
  html,body{
    overflow:hidden!important;
  }
  .hero{
    min-height:0!important;
    height:calc(100vh - 150px)!important;

    padding-top:8px!important;
  }
  .hero-copy{
    margin-top:0!important;
  }

    bottom:-128px!important;

    right:4vw!important;

  }
  .bottom img{
    height:68px!important;
    max-height:68px!important;
    object-fit:cover!important;
  }
  .bottom::before{
    top:-10px!important;
    bottom:-10px!important;
  }
}

  .hero{
    height:calc(100vh - 132px)!important;

  }

  }

    height:58px!important;
    max-height:58px!important;
  }
}
</style>

  }
  .bottom::before{
    top:-10px!important;
    bottom:-10px!important;
  }
}

  }

  }
}

    height:calc(100vh - 118px)!important;

  }

  }

  }

</style>

</head>
