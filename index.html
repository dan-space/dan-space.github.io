<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAN'S SPACE SETTLEMENT</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5eee5;font-family:"Aptos","Segoe UI Variable Text","Segoe UI","Helvetica Neue",Arial,sans-serif}
#app{height:100vh;display:grid;grid-template-rows:66px 1fr}
#nav{display:flex;align-items:center;padding:0 22px;background:rgba(248,241,232,.98);border-bottom:1px solid rgba(91,73,61,.13);z-index:20}
#home{border:0;background:none;cursor:pointer;padding:22px 0 18px;color:#b45f3d;font-size:12px;font-weight:850;letter-spacing:.07em;white-space:nowrap;position:relative}
#home.active:after,.mission.active:after{content:"";position:absolute;left:0;right:0;bottom:10px;height:2px;border-radius:2px;background:#c97750}
#title{margin-left:0;padding-left:0;border-left:0;font-size:14px;font-weight:850;letter-spacing:.09em;color:#51483f;white-space:nowrap}
#missions{flex:1;display:flex;justify-content:center;gap:18px;margin-left:28px;overflow:auto;scrollbar-width:none}
#missions::-webkit-scrollbar{display:none}
.mission{border:0;background:none;cursor:pointer;padding:22px 0 18px;position:relative;color:#766a60;font-size:11px;font-weight:800;white-space:nowrap}
.mission.active{color:#b45f3d}
#viewer{width:100%;height:100%;border:0;display:block;background:#f5eee5}
@media(max-width:1100px){
 #title{display:none}
 #missions{justify-content:flex-start;gap:14px}
}
@media(max-width:760px){
 #nav{padding:0 13px}
 #home{font-size:11px}
 #missions{margin-left:18px}
}
</style>

<style id="v20-nav-only">
/* V20 — navigation only. All page content, including HOME, is unchanged from V18. */
#nav{
  border-bottom:1px solid rgba(91,73,61,.20)!important;
  box-shadow:0 4px 14px rgba(86,66,52,.08)!important;
}
#title{
  font-size:15.5px!important;
  font-weight:900!important;
  letter-spacing:.075em!important;
}
#home,.mission{
  font-size:13.5px!important;
  font-weight:850!important;
  letter-spacing:.025em!important;
  padding:11px 10px!important;
  margin:5px 2px!important;
  border:1px solid rgba(201,119,80,.16)!important;
  border-radius:7px!important;
  background:rgba(255,255,255,.28)!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)!important;
  cursor:pointer!important;
}
#home:hover,.mission:hover{
  color:#934e35!important;
  background:rgba(201,119,80,.12)!important;
  border-color:rgba(201,119,80,.36)!important;
}
#home.active,.mission.active{
  color:#8f4b32!important;
  background:rgba(201,119,80,.16)!important;
  border-color:rgba(201,119,80,.42)!important;
}
#home.active::after,.mission.active::after{
  content:""!important;
  position:absolute!important;
  left:10px!important;
  right:10px!important;
  bottom:3px!important;
  height:3px!important;
  border-radius:2px!important;
  background:#c97750!important;
}
@media(max-width:1200px){
  #title{font-size:14px!important}
  #home,.mission{
    font-size:12.5px!important;
    padding-left:8px!important;
    padding-right:8px!important;
  }
}
</style>

<style id="v22-shell-responsive">
#nav{min-width:0}
#missions{min-width:0}
@media(max-width:1180px){
  #nav{padding-left:12px!important;padding-right:12px!important;gap:8px!important}
  #missions{
    overflow-x:auto!important;overflow-y:hidden!important;
    justify-content:flex-start!important;
    scrollbar-width:thin;
  }
  #home,.mission{
    flex:0 0 auto!important;
    font-size:12px!important;
    padding-left:7px!important;padding-right:7px!important;
    white-space:nowrap!important;
  }
  #title{font-size:13px!important;flex:0 0 auto!important}
}
@media(max-width:760px){
  #title{display:none!important}
  #nav{padding-left:6px!important;padding-right:6px!important}
  #home,.mission{font-size:11.5px!important}
}
</style>

<style id="v29-theme-title-enhanced">
#title{
  font-family:"Aptos Display","Segoe UI Variable Display","Helvetica Neue",Arial,sans-serif!important;
  font-size:19px!important;
  line-height:1!important;
  font-weight:950!important;
  letter-spacing:.085em!important;
  color:#9a4f32!important;
  text-shadow:0 1px 0 rgba(255,255,255,.65),0 0 14px rgba(201,119,80,.18)!important;
  white-space:nowrap!important;
}
@media(max-width:1180px){
  #title{font-size:17px!important;letter-spacing:.065em!important}
}
@media(max-width:760px){
  #title{display:none!important}
}
</style>

<style id="v33-bright-theme-title">
/* Make the site theme more distinctive without overpowering mission navigation. */
#title{
  color:#e36f3d!important;
  font-weight:950!important;
  text-shadow:
    0 1px 0 rgba(255,255,255,.92),
    0 0 10px rgba(227,111,61,.22)!important;
}
#title:hover{
  color:#f07b45!important;
}
</style>

<style id="home-v13-shell-fit">
#viewer{
  height:calc(100vh - 64px)!important;
  min-height:0!important;
}
</style>


<style id="v62-global-shell-responsive">
html,body,#app{width:100%;max-width:100%;min-width:0}
#nav,#missions,#viewer{min-width:0}
#missions{-webkit-overflow-scrolling:touch}
@media(max-width:900px){
  #app{grid-template-rows:58px minmax(0,1fr)!important}
  #nav{
    height:58px!important;
    min-height:58px!important;
    padding:0 8px!important;
    overflow:hidden!important;
  }
  #title{display:none!important}
  #home{
    flex:0 0 auto!important;
    font-size:11px!important;
    padding:9px 8px!important;
    margin:4px 1px!important;
  }
  #missions{
    margin-left:7px!important;
    gap:5px!important;
    overflow-x:auto!important;
    overflow-y:hidden!important;
    justify-content:flex-start!important;
    scroll-snap-type:x proximity;
  }
  .mission{
    flex:0 0 auto!important;
    font-size:10.5px!important;
    padding:9px 7px!important;
    margin:4px 1px!important;
    scroll-snap-align:start;
  }
  #viewer{
    height:calc(100dvh - 58px)!important;
    min-height:0!important;
  }
}
@media(max-width:520px){
  #app{grid-template-rows:54px minmax(0,1fr)!important}
  #nav{height:54px!important;min-height:54px!important;padding:0 5px!important}
  #home{font-size:10.5px!important;padding:8px 6px!important}
  #missions{margin-left:5px!important;gap:3px!important}
  .mission{font-size:10px!important;padding:8px 6px!important}
  #viewer{height:calc(100dvh - 54px)!important}
}
</style>

</head>
<body>
<div id="app">
<header id="nav">
  <div id="title">DAN'S SPACE SETTLEMENT</div>
  <nav id="missions">
    <button id="home" class="active" data-file="HOME.html">HOME</button>
    <button class="mission" data-key="questions" data-file="QUESTIONS.html">01 QUESTIONS</button>
    <button class="mission" data-key="settlement" data-file="SETTLEMENT.html">02 SETTLEMENT</button>
    <button class="mission" data-key="research" data-file="RESEARCH.html">03 RESEARCH</button>
    <button class="mission" data-key="think" data-file="THINK.html">04 THINK</button>
    <button class="mission" data-key="life" data-file="LIFE.html">05 LIFE</button>
    <button class="mission" data-key="achievements" data-file="ACHIEVEMENTS.html">06 ACHIEVEMENTS</button>
    <button class="mission" data-key="archive" data-file="ARCHIVE.html">07 ARCHIVE</button>
    <button class="mission" data-key="next" data-file="NEXT.html">08 NEXT</button>
  </nav>
</header>
<iframe id="viewer" src="HOME.html" title="DAN'S SPACE SETTLEMENT"></iframe>
</div>
<script>
const viewer=document.getElementById('viewer');
const home=document.getElementById('home');
const missions=[...document.querySelectorAll('.mission')];

function openPage(file,key){
  viewer.src=file;
  home.classList.toggle('active',key==='home');
  missions.forEach(b=>b.classList.toggle('active',b.dataset.key===key));
  history.replaceState(null,'','#'+key);
}
home.onclick=()=>openPage('HOME.html','home');
missions.forEach(b=>b.onclick=()=>openPage(b.dataset.file,b.dataset.key));

const routes={
 home:'HOME.html',questions:'QUESTIONS.html',settlement:'SETTLEMENT.html',
 research:'RESEARCH.html',think:'THINK.html',life:'LIFE.html',
 achievements:'ACHIEVEMENTS.html',archive:'ARCHIVE.html',next:'NEXT.html'
};
let initial=location.hash.slice(1);
if(routes[initial]) openPage(routes[initial],initial);

viewer.addEventListener('load',()=>{
  try{
    const d=viewer.contentDocument;
    const map={
      'HOME.html':['HOME.html','home'],'index.html':['HOME.html','home'],
      'QUESTION.html':['QUESTIONS.html','questions'],'QUESTIONS.html':['QUESTIONS.html','questions'],
      'SETTLEMENT.html':['SETTLEMENT.html','settlement'],'RESEARCH.html':['RESEARCH.html','research'],
      'THINK.html':['THINK.html','think'],'LIFE.html':['LIFE.html','life'],
      'ACHIEVEMENTS.html':['ACHIEVEMENTS.html','achievements'],'ARCHIVE.html':['ARCHIVE.html','archive'],
      'NEXT.html':['NEXT.html','next']
    };
    d.querySelectorAll('a[href]').forEach(a=>{
      const raw=(a.getAttribute('href')||'').split('#')[0].split('/').pop();
      if(map[raw]){
        a.addEventListener('click',e=>{
          e.preventDefault();
          openPage(map[raw][0],map[raw][1]);
        });
      }
    });
  }catch(e){}
});
</script>
</body>
</html>
